<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitron - Advanced Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --button-bg: #f7fafc;
            --button-hover: #edf2f7;
            --button-active: #e2e8f0;
            --operator-bg: #805ad5;
            --operator-hover: #6b46c1;
            --function-bg: #4a5568;
            --function-hover: #2d3748;
            --equals-bg: #48bb78;
            --equals-hover: #38a169;
            --clear-bg: #f56565;
            --clear-hover: #e53e3e;
            --display-bg: #1a202c;
            --display-text: #ffffff;
            --history-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --primary-bg: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            --secondary-bg: #2d3748;
            --text-primary: #f7fafc;
            --text-secondary: #cbd5e0;
            --button-bg: #4a5568;
            --button-hover: #718096;
            --button-active: #2d3748;
            --operator-bg: #805ad5;
            --operator-hover: #9f7aea;
            --function-bg: #1a202c;
            --function-hover: #2d3748;
            --equals-bg: #48bb78;
            --equals-hover: #68d391;
            --clear-bg: #f56565;
            --clear-hover: #fc8181;
            --display-bg: #000000;
            --display-text: #ffffff;
            --history-bg: rgba(45, 55, 72, 0.95);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--primary-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: var(--transition);
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .calculator {
            background: var(--secondary-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            flex: 1;
            max-width: 500px;
            transition: var(--transition);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
        }

        .toggle-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--button-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
        }

        .toggle-btn:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
        }

        .toggle-btn.active {
            background: var(--operator-bg);
            color: white;
        }

        .display-container {
            background: var(--display-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .display {
            font-size: 36px;
            color: var(--display-text);
            text-align: right;
            font-weight: 300;
            min-height: 50px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: var(--transition);
        }

        .expression {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: right;
            margin-bottom: 10px;
            min-height: 20px;
        }

        .buttons {
            display: grid;
            gap: 10px;
        }

        .basic-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .scientific-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .memory-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        button:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active:before {
            width: 300px;
            height: 300px;
        }

        .btn-number {
            background: var(--button-bg);
            color: var(--text-primary);
        }

        .btn-number:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-operator {
            background: var(--operator-bg);
            color: white;
        }

        .btn-operator:hover {
            background: var(--operator-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(128, 90, 213, 0.3);
        }

        .btn-function {
            background: var(--function-bg);
            color: white;
            font-size: 14px;
        }

        .btn-function:hover {
            background: var(--function-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-equals {
            background: var(--equals-bg);
            color: white;
            grid-column: span 2;
        }

        .btn-equals:hover {
            background: var(--equals-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }

        .btn-clear {
            background: var(--clear-bg);
            color: white;
        }

        .btn-clear:hover {
            background: var(--clear-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.3);
        }

        .btn-zero {
            grid-column: span 2;
        }

        .history-panel {
            background: var(--history-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            width: 350px;
            max-height: 600px;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .clear-history {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--clear-bg);
            color: white;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .clear-history:hover {
            background: var(--clear-hover);
            transform: translateY(-2px);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            padding: 15px;
            background: var(--button-bg);
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-item:hover {
            background: var(--button-hover);
            transform: translateX(5px);
        }

        .history-expression {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .history-result {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .angle-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--button-bg);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .memory-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--button-bg);
            padding: 4px 8px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .memory-indicator.active {
            opacity: 1;
        }

        /* Responsive Design - Breakpoint at 800px */
        @media (max-width: 800px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .history-panel {
                width: 100%;
                max-width: 500px;
                max-height: 300px;
            }

            .calculator {
                max-width: 100%;
            }

            button {
                padding: 15px;
                font-size: 16px;
            }

            .display {
                font-size: 28px;
            }

            .title {
                font-size: 20px;
            }

            .toggle-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .btn-function {
                font-size: 12px;
            }
        }

        /* Small mobile devices */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .calculator {
                padding: 20px;
            }

            .history-panel {
                padding: 20px;
            }

            button {
                padding: 12px;
                font-size: 14px;
            }

            .display {
                font-size: 24px;
            }

            .scientific-buttons {
                grid-template-columns: repeat(4, 1fr);
            }

            .memory-buttons {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .tooltip {
            position: absolute;
            background: var(--function-bg);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            white-space: nowrap;
        }

        button:hover .tooltip {
            opacity: 1;
        }

        /* Mobile-specific optimizations */
        @media (hover: none) {
            button:active {
                transform: scale(0.95);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="header">
                <div class="title">
                    <span>🔢</span>
                    <span>Digitron</span>
                </div>
                <div class="mode-toggle">
                    <button class="toggle-btn" id="themeToggle">🌙</button>
                    <button class="toggle-btn active" id="basicMode">Basic</button>
                    <button class="toggle-btn" id="scientificMode">Scientific</button>
                </div>
            </div>

            <div class="display-container">
                <div class="angle-indicator" id="angleIndicator">DEG</div>
                <div class="memory-indicator" id="memoryIndicator">M</div>
                <div class="expression" id="expression"></div>
                <div class="display" id="display">0</div>
            </div>

            <div class="buttons">
                <div class="memory-buttons" id="memoryButtons" style="display: none;">
                    <button class="btn-function" onclick="memoryOperation('MC')">MC</button>
                    <button class="btn-function" onclick="memoryOperation('MR')">MR</button>
                    <button class="btn-function" onclick="memoryOperation('M+')">M+</button>
                    <button class="btn-function" onclick="memoryOperation('M-')">M-</button>
                    <button class="btn-function" onclick="memoryOperation('MS')">MS</button>
                </div>

                <div class="scientific-buttons" id="scientificButtons" style="display: none;">
                    <button class="btn-function" onclick="appendFunction('sin(')">sin</button>
                    <button class="btn-function" onclick="appendFunction('cos(')">cos</button>
                    <button class="btn-function" onclick="appendFunction('tan(')">tan</button>
                    <button class="btn-function" onclick="appendFunction('log(')">log</button>
                    <button class="btn-function" onclick="appendFunction('ln(')">ln</button>
                    <button class="btn-function" onclick="appendFunction('sqrt(')">√</button>
                    <button class="btn-function" onclick="appendOperator('^')">x^y</button>
                    <button class="btn-function" onclick="appendFunction('factorial(')">n!</button>
                    <button class="btn-function" onclick="appendConstant('π')">π</button>
                    <button class="btn-function" onclick="appendConstant('e')">e</button>
                    <button class="btn-function" onclick="appendFunction('abs(')">|x|</button>
                    <button class="btn-function" onclick="appendOperator('**2')">x²</button>
                    <button class="btn-function" onclick="appendOperator('**3')">x³</button>
                    <button class="btn-function" onclick="appendOperator('**0.5')">∛</button>
                    <button class="btn-function" onclick="appendFunction('1/(')">1/x</button>
                </div>

                <div class="basic-buttons">
                    <button class="btn-clear" onclick="clearAll()">AC</button>
                    <button class="btn-clear" onclick="clearEntry()">CE</button>
                    <button class="btn-operator" onclick="appendOperator('%')">%</button>
                    <button class="btn-operator" onclick="appendOperator('/')">÷</button>
                    
                    <button class="btn-number" onclick="appendNumber('7')">7</button>
                    <button class="btn-number" onclick="appendNumber('8')">8</button>
                    <button class="btn-number" onclick="appendNumber('9')">9</button>
                    <button class="btn-operator" onclick="appendOperator('*')">×</button>
                    
                    <button class="btn-number" onclick="appendNumber('4')">4</button>
                    <button class="btn-number" onclick="appendNumber('5')">5</button>
                    <button class="btn-number" onclick="appendNumber('6')">6</button>
                    <button class="btn-operator" onclick="appendOperator('-')">−</button>
                    
                    <button class="btn-number" onclick="appendNumber('1')">1</button>
                    <button class="btn-number" onclick="appendNumber('2')">2</button>
                    <button class="btn-number" onclick="appendNumber('3')">3</button>
                    <button class="btn-operator" onclick="appendOperator('+')">+</button>
                    
                    <button class="btn-number btn-zero" onclick="appendNumber('0')">0</button>
                    <button class="btn-number" onclick="appendDecimal()">.</button>
                    <button class="btn-equals" onclick="calculate()">=</button>
                </div>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <div class="history-title">📜 History</div>
                <button class="clear-history" onclick="clearHistory()">Clear</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let expression = '';
        let memory = 0;
        let history = [];
        let angleMode = 'DEG';
        let isScientificMode = false;
        let lastWasOperator = false;

        const display = document.getElementById('display');
        const expressionDisplay = document.getElementById('expression');
        const historyList = document.getElementById('historyList');
        const memoryIndicator = document.getElementById('memoryIndicator');
        const angleIndicator = document.getElementById('angleIndicator');

        // Theme toggle
        document.getElementById('themeToggle').addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            this.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // Mode toggles
        document.getElementById('basicMode').addEventListener('click', function() {
            isScientificMode = false;
            document.getElementById('scientificButtons').style.display = 'none';
            document.getElementById('memoryButtons').style.display = 'none';
            this.classList.add('active');
            document.getElementById('scientificMode').classList.remove('active');
        });

        document.getElementById('scientificMode').addEventListener('click', function() {
            isScientificMode = true;
            document.getElementById('scientificButtons').style.display = 'grid';
            document.getElementById('memoryButtons').style.display = 'grid';
            this.classList.add('active');
            document.getElementById('basicMode').classList.remove('active');
        });

        function updateDisplay() {
            display.textContent = currentInput;
            expressionDisplay.textContent = expression;
            
            // Adjust font size for long numbers
            if (currentInput.length > 10) {
                display.style.fontSize = '24px';
            } else if (currentInput.length > 15) {
                display.style.fontSize = '18px';
            } else {
                display.style.fontSize = '36px';
            }
        }

        function appendNumber(num) {
            if (currentInput === '0' || lastWasOperator) {
                currentInput = num;
                lastWasOperator = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOperator(op) {
            if (expression && !lastWasOperator) {
                expression += currentInput + ' ' + op + ' ';
            } else {
                expression = currentInput + ' ' + op + ' ';
            }
            currentInput = '0';
            lastWasOperator = true;
            updateDisplay();
        }

        function appendFunction(func) {
            if (func === 'factorial(') {
                if (currentInput !== '0') {
                    expression = currentInput + '!';
                    calculateFactorial();
                }
            } else {
                expression = func;
                currentInput = '0';
                updateDisplay();
            }
        }

        function appendConstant(constant) {
            if (constant === 'π') {
                currentInput = Math.PI.toString();
            } else if (constant === 'e') {
                currentInput = Math.E.toString();
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            expression = '';
            lastWasOperator = false;
            updateDisplay();
        }

        function clearEntry() {
            currentInput = '0';
            updateDisplay();
        }

        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculate() {
            let fullExpression = expression + currentInput;
            
            try {
                // Replace mathematical functions and constants
                fullExpression = fullExpression.replace(/sin\(/g, 'Math.sin(');
                fullExpression = fullExpression.replace(/cos\(/g, 'Math.cos(');
                fullExpression = fullExpression.replace(/tan\(/g, 'Math.tan(');
                fullExpression = fullExpression.replace(/log\(/g, 'Math.log10(');
                fullExpression = fullExpression.replace(/ln\(/g, 'Math.log(');
                fullExpression = fullExpression.replace(/sqrt\(/g, 'Math.sqrt(');
                fullExpression = fullExpression.replace(/abs\(/g, 'Math.abs(');
                fullExpression = fullExpression.replace(/\^/g, '**');
                fullExpression = fullExpression.replace(/×/g, '*');
                fullExpression = fullExpression.replace(/÷/g, '/');
                fullExpression = fullExpression.replace(/−/g, '-');
                fullExpression = fullExpression.replace(/π/g, Math.PI);
                fullExpression = fullExpression.replace(/e/g, Math.E);
                
                // Handle angle conversion
                if (angleMode === 'DEG') {
                    fullExpression = fullExpression.replace(/Math\.sin\(([^)]+)\)/g, (match, p1) => {
                        return `Math.sin(${p1} * Math.PI / 180)`;
                    });
                    fullExpression = fullExpression.replace(/Math\.cos\(([^)]+)\)/g, (match, p1) => {
                        return `Math.cos(${p1} * Math.PI / 180)`;
                    });
                    fullExpression = fullExpression.replace(/Math\.tan\(([^)]+)\)/g, (match, p1) => {
                        return `Math.tan(${p1} * Math.PI / 180)`;
                    });
                }
                
                let result = eval(fullExpression);
                
                // Handle special cases
                if (isNaN(result)) {
                    result = 'Error';
                } else if (!isFinite(result)) {
                    result = 'Infinity';
                } else {
                    result = parseFloat(result.toPrecision(12));
                }
                
                // Add to history
                addToHistory(expression + currentInput, result);
                
                // Update display
                expression = '';
                currentInput = result.toString();
                lastWasOperator = false;
                updateDisplay();
                
            } catch (error) {
                currentInput = 'Error';
                updateDisplay();
                setTimeout(() => {
                    clearAll();
                }, 1500);
            }
        }

        function calculateFactorial() {
            try {
                let num = parseInt(currentInput);
                if (num < 0) {
                    currentInput = 'Error';
                } else if (num === 0 || num === 1) {
                    currentInput = '1';
                } else {
                    let result = 1;
                    for (let i = 2; i <= num; i++) {
                        result *= i;
                    }
                    currentInput = result.toString();
                }
                addToHistory(num + '!', currentInput);
                expression = '';
                updateDisplay();
            } catch (error) {
                currentInput = 'Error';
                updateDisplay();
            }
        }

        function memoryOperation(operation) {
            const value = parseFloat(currentInput);
            
            switch(operation) {
                case 'MC':
                    memory = 0;
                    memoryIndicator.classList.remove('active');
                    break;
                case 'MR':
                    currentInput = memory.toString();
                    updateDisplay();
                    break;
                case 'M+':
                    memory += value;
                    memoryIndicator.classList.add('active');
                    break;
                case 'M-':
                    memory -= value;
                    if (memory === 0) {
                        memoryIndicator.classList.remove('active');
                    }
                    break;
                case 'MS':
                    memory = value;
                    memoryIndicator.classList.add('active');
                    break;
            }
        }

        function toggleAngleMode() {
            angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
            angleIndicator.textContent = angleMode;
        }

        function addToHistory(expr, result) {
            history.unshift({
                expression: expr,
                result: result
            });
            
            if (history.length > 50) {
                history.pop();
            }
            
            updateHistoryDisplay();
        }

        function updateHistoryDisplay() {
            historyList.innerHTML = '';
            
            history.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="history-expression">${item.expression}</div>
                    <div class="history-result">= ${item.result}</div>
                `;
                historyItem.onclick = () => {
                    currentInput = item.result.toString();
                    expression = '';
                    updateDisplay();
                };
                historyList.appendChild(historyItem);
            });
        }

        function clearHistory() {
            history = [];
            updateHistoryDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendNumber(key);
            } else if (key === '.') {
                appendDecimal();
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendOperator(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Backspace') {
                backspace();
            } else if (key === '%') {
                appendOperator('%');
            } else if (key === '(' || key === ')') {
                appendOperator(key);
            }
        });

        // Angle mode toggle on click
        angleIndicator.addEventListener('click', toggleAngleMode);

        // Initialize display
        updateDisplay();
        
        // Load history from localStorage
        const savedHistory = localStorage.getItem('digitronHistory');
        if (savedHistory) {
            history = JSON.parse(savedHistory);
            updateHistoryDisplay();
        }

        // Save history to localStorage
        window.addEventListener('beforeunload', function() {
            localStorage.setItem('digitronHistory', JSON.stringify(history));
        });

        // Touch optimization for mobile
        if ('ontouchstart' in window) {
            document.querySelectorAll('button').forEach(button => {
                button.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                });
                
                button.addEventListener('touchend', function() {
                    this.style.transform = '';
                });
            });
        }
    </script>
</body>
</html>
